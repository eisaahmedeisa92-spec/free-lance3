<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeForge Freelance — Sign In</title>
  <link rel="stylesheet" href="../style/signin.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      <span class="brand-mark">&lt;/&gt;</span>
      <span class="brand-name">CodeForge</span>
    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="signin.html" class="active">Sign In</a>
      <a href="signup.html">Sign Up</a>
      <a href="orders.html">Request a Project</a>
      <a href="instructions.html">Guidelines</a>
    </div>
  </nav>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <p class="eyebrow">Welcome back</p>
        <h1>Sign in to your account</h1>
        <p class="auth-sub">Sign in to submit a new project request or check on one you already sent.</p>
      </div>

      <form id="signinForm" class="auth-form">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-flex">
      <span>&copy; 2026 CodeForge Freelance</span>
      <span>Contact: 01030340178</span>
    </div>
  </footer>

  <script>
    document.getElementById('signinForm').addEventListener('submit', function (e) {
      e.preventDefault();
      // In a full build this would verify credentials against a server.
      // For this static site, a successful sign-in takes the user to the homepage.
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
